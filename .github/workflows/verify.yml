name: Verificar Notix EFT

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Maven - ${{ matrix.servicio }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        servicio: [ms-usuarios, ms-tramites]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/${{ matrix.servicio }}/pom.xml
      - name: Probar microservicio
        run: mvn -B -f backend/${{ matrix.servicio }}/pom.xml test

  android:
    name: Android - pruebas y APK debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar SDK Android 36
        run: |
          SDKM="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          if [ -z "$SDKM" ]; then echo "No se encontro sdkmanager"; exit 1; fi
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Compilar y ejecutar pruebas Android JVM
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:jacocoTestReport --stacktrace

      - name: Mostrar porcentaje de cobertura de lógica
        working-directory: android
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          archivo = Path("app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml")
          if not archivo.exists():
              raise SystemExit("Falta el archivo XML JaCoCo")
          root = ET.parse(archivo).getroot()
          counters = [x for x in root.findall("counter") if x.get("type") == "LINE"]
          if not counters:
              raise SystemExit("JaCoCo no reporto lineas de codigo")
          c = counters[0]
          cubiertas = int(c.get("covered"))
          total = cubiertas + int(c.get("missed"))
          if not total:
              raise SystemExit("Reporte sin clases incluidas: revisar classDirectories")
          print(f"COBERTURA DE LOGICA ANDROID: {100 * cubiertas / total:.2f}% ({cubiertas}/{total} lineas)")
          print("OBJETIVO DE LA PAUTA EP4: >=80%")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cobertura-android-jacoco
          path: android/app/build/reports/jacoco/jacocoTestReport/
