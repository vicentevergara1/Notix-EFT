name: Verificar Notix EFT

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Maven - ${{ matrix.servicio }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        servicio: [ms-usuarios, ms-tramites]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/${{ matrix.servicio }}/pom.xml
      - name: Probar microservicio
        run: mvn -B -f backend/${{ matrix.servicio }}/pom.xml test

  android:
    name: Android - pruebas y APK debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar SDK Android 36
        run: |
          SDKM="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          if [ -z "$SDKM" ]; then echo "No se encontro sdkmanager"; exit 1; fi
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Compilar y ejecutar pruebas Android JVM
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
